<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV Tailor | Job Description Analyser</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">CV Tailor / v0.1</p>
      <h1 id="page-title">Turn a job description into a useful brief.</h1>
      <p class="intro-copy">Paste a role below and surface the language that matters for your next application.</p>
    </section>

    <section class="workspace" aria-label="Job description analysis">
      <form id="analyse-form" novalidate>
        <div class="field-heading">
          <label for="job-description">Job description</label>
          <span id="character-count">0 characters</span>
        </div>
        <textarea
          id="job-description"
          name="job_description"
          rows="14"
          placeholder="Paste the full job description here..."
          required
        ></textarea>
        <p id="form-error" class="message error" role="alert" hidden></p>
        <button id="analyse-button" type="submit">
          <span id="button-label">Analyse job</span>
          <span id="loading-label" hidden>Analysing...</span>
        </button>
      </form>

      <section id="results" class="results" aria-labelledby="results-title" hidden>
        <div class="results-heading">
          <p class="eyebrow">Analysis</p>
          <h2 id="results-title">What this role is asking for</h2>
        </div>
        <div class="result-grid">
          <article class="result-card result-card-wide">
            <h3>Job title</h3>
            <p id="job-title" class="job-title"></p>
          </article>
          <article class="result-card">
            <h3>Technical skills</h3>
            <ul id="technical-skills"></ul>
          </article>
          <article class="result-card">
            <h3>Other keywords</h3>
            <ul id="other-keywords"></ul>
          </article>
          <article class="result-card">
            <h3>Responsibilities</h3>
            <ul id="responsibilities"></ul>
          </article>
          <article class="result-card">
            <h3>Qualifications</h3>
            <ul id="qualifications"></ul>
          </article>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
